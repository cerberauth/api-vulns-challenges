worker_processes 1;
events { worker_connections 1024; }

http {
    server {
        listen 8080;
        server_name localhost;

        # fixed: explicit root fallback returns 404 instead of exposing the filesystem
        root /usr/share/nginx/html;
        location / {
            try_files $uri $uri/ =404;
        }

        # fixed: trailing slash on both location and alias, no traversal possible
        location /files/ {
            alias /usr/share/nginx/html/public/;
        }

        # fixed: resolver pinned to a trusted, internal DNS server
        resolver 10.0.0.2 valid=300s;

        # fixed: the upstream always receives a fixed, known-good Host value
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host app.example.com;
        }
    }
}
