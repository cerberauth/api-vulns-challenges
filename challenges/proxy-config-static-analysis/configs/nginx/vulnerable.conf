worker_processes 1;
events { worker_connections 1024; }

http {
    # vulnerable: no explicit "root" location, so a request that doesn't
    # match any other location falls through to the global root and can
    # serve files from the server's filesystem, including this config file
    root /etc/nginx;

    server {
        listen 8080;
        server_name localhost;

        # vulnerable: off-by-slash alias traversal (see nginx-alias-traversal challenge)
        location /files {
            alias /usr/share/nginx/html/public/;
        }

        # vulnerable: resolver uses a public/untrusted DNS server, enabling
        # DNS-spoofing based SSRF against upstreams resolved at request time
        resolver 8.8.8.8;

        # vulnerable: proxied requests blindly forward the client's
        # Host header upstream, enabling host header injection
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
        }
    }
}
