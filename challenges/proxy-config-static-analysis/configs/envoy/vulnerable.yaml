# Envoy static configuration - vulnerable
static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                # vulnerable: XFF is trusted from an unbounded number of hops,
                # so a client can prepend a spoofed address that is treated as
                # trusted by everything downstream
                xff_num_trusted_hops: 0
                use_remote_address: false
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_service }
                http_filters:
                  - name: envoy.filters.http.router
  clusters:
    - name: admin_interface
      # vulnerable: the Envoy admin interface (config dump, stats, /certs) is
      # bound to all interfaces instead of loopback-only
      connect_timeout: 0.25s
admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
